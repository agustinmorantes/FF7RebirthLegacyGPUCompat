[legacygpu]
; Legacy GPU Compatibility for FINAL FANTASY VII REBIRTH. The defaults are the tested configuration;
; most players never need to change anything here.
;
; Always on (no settings): the device is created at 12_1 when the game asks for 12_2, feature
; queries report 12_2 and mesh shader tier 1, and a PSO or command signature the driver rejects
; becomes a dummy whose draws, dispatches and ExecuteIndirects are dropped.
; Run mesh shaders converted by tools/ms2cs.py (legacygpu_shaders\<hash>.emucs7.cso/.emuvs7.cso) as
; a compute pass plus an indexed draw. 0, or a mesh shader without a converted pair, drops the
; mesh draws instead.
EmulateMeshShaders=1
; Mesh-emulation scratch sizing. Every emulated call's needs are read back once its command
; allocator is reset (the GPU has finished it then). When a call needs more than 70 % of the index
; or vertex region, the scratch is replaced by one with 1.5x the need, rounded up to a multiple of
; MeshScratchStepMiB and at least MeshScratchMinMiB. After MeshScratchShrinkSeconds in which a
; smaller size would still have been enough, it shrinks by one step. A call larger than anything
; seen before can lose groups until completed feedback increases its PSO's retry passes; a later
; resize lowers passes the new capacity no longer needs. Only
; newly recorded calls adapt; there is no fixed feedback delay in frames. Rebalancing at the cap
; runs at most once per shrink window, and the growth path cannot shrink the current capacity.
MeshScratchMinMiB=384
; Maximum geometry capacity; two retry lists add 64 MiB. Overflow beyond the currently recorded
; passes is counted and used to adapt subsequent calls. No gameplay-derived pass ceiling.
MeshScratchMaxMiB=512
MeshScratchStepMiB=128
MeshScratchShrinkSeconds=30
; Retain mesh-emulation compute bindings between calls; replay only changed graphics arguments.
; Restore the game's compute state before compute commands/setters or descriptor-heap changes.
; Bundles/metacommands disable retention until Reset/ClearState. 0 restores per-call behavior.
OptimizeMeshRootBindings=1
;
; ---- Diagnostics ----
; For bug reports and development only. They add log output (and some GPU work) and cost
; performance. Leave them all at 0 for normal play.
; 1 = log an EMU usage line with every STATS line: scratch size and split, emulated calls, the
; largest index and vertex bytes one call needed, overflow and resize counts. The counters are
; always collected (they size the scratch); this only adds the log line, plus a log line and a pixel
; shader dump per created emulation PSO. Overflow (geometry a call couldn't fit) is always logged as a WARN.
MeshUsageDiagnostics=0
; Log process local/non-local GPU-memory usage and budget, scratch bytes and cache counts.
; All memory values are bytes. Does not change texture quality or memory budgets.
MemoryDiagnostics=0
; 1 = sampled GPU profile of emulated mesh calls: at most 8 calls/s and 1/s per mesh PSO. Each
; pass logs a MESHPROF line once its submission's private fence has completed: timestamp ticks
; and microseconds (queue frequency) for compute = InjectMesh start to just before the indexed draw
; (scratch reset copy, its barriers, the converted MS dispatch and the barrier to read state) and
; draw = the indexed draw; raw CSInvocations; and the 112-byte scratch header. Timestamps are
; end-of-pipe and may include waits for earlier GPU work. When no slot is free a call is not sampled
; (diagnostics only, geometry is unaffected). 2 = every call, no rate limit (test harness only).
; 0 creates no queries, readback, fences or extra GPU commands.
MeshPerformanceDiagnostics=0
; N = per-pass GPU profile: every N seconds, direct lists started within a 60 ms window (about two
; frames) record a timestamp before the first draw or dispatch after each render-target change
; or compute/graphics switch. Each span logs a PASSPROF line once its submission's private fence
; has completed: start tick, duration, compute or graphics, RT0 and depth size and DXGI format,
; draw/dispatch/indirect/emulated counts. A span also contains the barriers, clears and copies
; recorded after its last draw. 0 adds no hooks or GPU commands.
PassPerformanceDiagnostics=0
; 1 = F12 opens one extra pass window that also logs each pass's render targets and barriers and
; dumps its textures. Needs PassPerformanceDiagnostics set (any N). 0 adds nothing.
PassResourceDiagnostics=0
